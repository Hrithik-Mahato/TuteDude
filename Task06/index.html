<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login- Laundry Mart </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <div class="left-section">
            <img src="https://plus.unsplash.com/premium_vector-1737303315449-8a6e1517d86a?q=80&w=2246&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Login Page Image">
        </div>
        <div class="right-section">
            <div class="form-wrapper">
                <div class="header-and-description">
                    <h1>Hello Again!</h1>
                    <p>Welcome back! We missed you!</p>
                </div>

                <form action="#">
                    <div class="form-input">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Emailid@site.com" required>
                    </div>

                    <div class="form-input">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <div class="forgot-link">
                        <a href="#">Forgot Password</a>
                    </div>

                    <button type="submit" class="btn">Login</button>

                    <p class="register-text">
                        Not a member(New Memeber)? <a href="#">Register Now</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
