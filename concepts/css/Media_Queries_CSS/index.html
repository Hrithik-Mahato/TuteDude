<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Media Queries in CSS</h1>
    <div class="container">
        <div class="left">
            <h1>My Portfolio</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti vitae sunt mollitia et aliquid pariatur fugit, eligendi illo qui maiores ad, animi sequi, non nostrum ea similique! Assumenda, unde nulla!</p>
        </div>
        <div class="right">
            <div class="child-imgs row-2" style="background-image: url(https://images.unsplash.com/photo-1626808642875-0aa545482dfb?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);">Flower</div>
            <div class="child-imgs" style="background-image: url(https://images.unsplash.com/photo-1720884413532-59289875c3e1?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);">Nature</div>
            <div class="child-imgs  row-2" style="background-image: url(https://images.unsplash.com/photo-1775701262135-58eaba3f0724?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);">Ducks</div>
            <div class="child-imgs" style="background-image: url(https://images.unsplash.com/photo-1764462715822-b9bcf2ba61a5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);">sun set</div>
            <div class="child-imgs col-2" style="background-image: url(https://media.istockphoto.com/id/121199853/photo/closeup-of-guy-working-on-a-laptop-indoor.webp?a=1&b=1&s=612x612&w=0&k=20&c=1cFqSPIjH981E69lJFNrRiqUDDsOqHfRdpW2CKu9sSc=);">Laptop</div>
            <div class="child-imgs col-2" style="background-image: url(https://media.istockphoto.com/id/984020344/photo/child-playing-outdoor-in-the-nature.webp?a=1&b=1&s=612x612&w=0&k=20&c=-DggIw5S0muKT_Veh9hX4BInQESqU1CTwZna-qAMWr0=);">Childrens</div>
            <div class="child-imgs row-2-reverse" style="background-image: url(https://images.unsplash.com/photo-1502085671122-2d218cd434e6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);">Mountain</div>
        </div>
    </div>
</body>
</html>
