<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flex Box in CSS</h1>
    <div class="container">
        <div class="box">box-1</div>
        <div class="box">box-2</div>
        <div class="box">box-3</div>
        <div class="box">box-4</div>
        <div class="box">box-5</div>
        <div class="box">box-6</div>
        <div class="box">box-7</div>
        <div class="box">box-8</div>
    </div>
    <!-- .container2>.box2#box-${box-$}*8 The anazing emmet Abbreviation for creating identity class-->
     <div class="container2">
        <div class="box2" id="box-1">box-1</div>
        <div class="box2" id="box-2">box-2</div>
        <div class="box2" id="box-3">box-3</div>
        <div class="box2" id="box-4">box-4</div>
        <div class="box2" id="box-5">box-5</div>
        <div class="box2" id="box-6">box-6</div>
        <div class="box2" id="box-7">box-7</div>
        <div class="box2" id="box-8">box-8</div>
     </div>
</body>
</html>
